name: Issue Triage

# Triages new/reopened issues automatically: formatea el body, clasifica con
# labels (AI), y añade secciones relevantes (resumen, severidad, área de
# código, pasos sugeridos). Preserva intacto el texto original del autor.
# Reutiliza el action de opencode ya configurado en el repo.

on:
  issues:
    types: [opened, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Estás actuando como agente de triage automático. Se acaba de
            abrir/reabrir el issue #${{ github.event.issue.number }} en este
            repositorio.

            TU ÚNICA TAREA es triar el issue. NO modifiques código, NO crees
            branches, NO abras pull requests. Tus únicos outputs permitidos
            son: editar el body del issue, añadir/remover labels y publicar
            un comentario de resumen.

            Pasos:

            1. Lee el issue completo: ejecuta
               `gh issue view ${{ github.event.issue.number }}` para obtener
               título y body originales.

            2. Lee el contexto del repo: AGENTS.md y README.md describen que
               es un clon estático de Asteroids en vanilla JS, todo en un
               único archivo `game.js`, sin build/tests/lint. Usa ese contexto
               para estimar el área de código.

            3. Clasifica el issue en UNO o MÁS de estos labels: bug,
               enhancement, question, docs, discussion. Añade SIEMPRE el label
               `needs-triage` al inicio y REMUEVELO al terminar. Usa `gh` para
               los labels. Si un label no existe, créalo con:
                 gh label create <name> --color <hex> --description "..."
               Colores/descripciones sugeridos:
                 bug                red   "Algo no funciona según lo esperado"
                 enhancement        a2eeef "Mejora o nueva característica"
                 question           d876e3 "Pregunta o duda"
                 docs               0075ca "Documentación"
                 discussion         fef2c0 "Discusión o feedback"
                 needs-triage       fbca04 "Pendiente de triage"

            4. Genera (en español, conciso) las siguientes secciones:
               - Resumen (1-3 líneas): qué pide o reporta el issue.
               - Severidad sugerida: crítica | alta | media | baja, con breve
                 justificación (ej. "alta: rompe la jugabilidad de forma
                 reproducible").
               - Área de código probable: archivo + sección/función (ej.
                 `game.js — colisiones (game.js:342)`). Si no aplica, "N/A".
               - Pasos sugeridos (para bugs) o Criterios de aceptación (para
                 features): 3-5 puntos accionables.
               - Notas: info relevante (posibles duplicados, archivos a
                 revisar, riesgos). Si no hay nada, "—" .

            5. Edita el body del issue con `gh issue edit
               ${{ github.event.issue.number }} --body-file <file>` dejándolo
               con esta estructura EXACTA (markdown):

                 ---
                 ## Triage automático (opencode)

                 - **Severidad:** <valor>
                 - **Etiquetas:** <lista>
                 - **Área de código:** <valor>

                 ### Resumen
                 <texto>

                 ### Pasos sugeridos / Criterios de aceptación
                 - <item>
                 - <item>

                 ### Notas
                 <texto>
                 ---

                 <details>
                 <summary>📝 Descripción original del autor (sin modificar)</summary>

                 <contenido EXACTO del body original, byte a byte>

                 </details>

               El body original del autor debe quedar INTACTO dentro del bloque
               <details>: no lo corrijas, reformatees ni traduzcas. Solo
               enciérralo en el details.

            6. Quita el label `needs-triage`:
               `gh issue edit ${{ github.event.issue.number }} --remove-label needs-triage`

            7. Publica UN comentario breve confirmando:
               "Triage completado. Severidad: X. Labels: Y. Área: Z."
               No publiques más comentarios.

            Restricciones:
            - No alteres el título del issue.
            - No cierres ni reabras el issue.
            - No asignes personas.
            - Si el issue está vacío o es spam manifiesto (ventas, phishing,
              sin contenido técnico), NO lo trajes: solo añade `needs-triage`,
              comenta brevemente "Pendiente de revisión manual" y termina sin
              editar el body.